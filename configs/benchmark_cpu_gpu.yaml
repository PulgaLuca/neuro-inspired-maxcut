experiment:
  name: "benchmark_cpu_gpu"
  seed: 99
  repetitions: 3
  output:
    root: "results"
    save_graph_image: false
    save_solution: true
    save_logs: true

execution:
  time_limit_seconds: 60
  fail_fast: false

graphs:
  - name: "er_weighted_small"
    type: "erdos_renyi"
    sizes: [18]
    density: 0.25
    weighted: true

algorithms:
  - name: "exact"
    params:
      max_nodes: 18
      gpu_batch_size: 2048
  - name: "local_search"
    params:
      max_iterations: 1000
  - name: "simulated_annealing"
    params:
      steps: 5000
      initial_temperature: 10.0
      final_temperature: 0.01
      gpu_replicas: 128

backends:
  - name: "cpu"
    params: {}
  - name: "gpu"
    params:
      device_index: 0
