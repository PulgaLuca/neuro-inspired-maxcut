experiment:
  name: "benchmark_qaoa_cpu"
  seed: 27
  repetitions: 3
  output:
    root: "results"
    save_graph_image: false
    save_solution: true
    save_logs: true

execution:
  time_limit_seconds: 30
  fail_fast: false

graphs:
  - name: "er_qaoa_small"
    type: "erdos_renyi"
    sizes: [8]
    density: 0.4
    weighted: false

algorithms:
  - name: "simulated_annealing"
    params:
      steps: 3000
      initial_temperature: 10.0
      final_temperature: 0.01
  - name: "local_search"
    params:
      max_iterations: 10000

backends:
  - name: "cpu"
    params: {}
