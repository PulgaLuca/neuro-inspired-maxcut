[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-inspired-maxcut"
version = "0.1.0"
description = "Modular optimization algorithm benchmarking"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy",
    "networkx",
    "scipy",
    "pydantic",
    "PyYAML",
    "typer",
    "matplotlib",
]

[project.optional-dependencies]
analysis = [
    "pandas",
]
energy = [
    "nvidia-ml-py",
]
gpu = [
    "cupy-cuda12x>=13",
]
quantum = [
    "qiskit>=1.4",
    "qiskit-ibm-runtime>=0.40",
]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
neuro-inspired-maxcut = "cli:app"

[tool.setuptools]
py-modules = ["cli"]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
